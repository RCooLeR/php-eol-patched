name: Build a PHP release

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ inputs.version }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ inputs.target }}
      PHP_RELEASE: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check Dockerfile and Compose
        run: |
          docker buildx bake --check --set "*.platform=linux/$ARCH" "$TARGET" "$TARGET-debian"
          docker compose -f compose.example.yaml config --quiet
      - name: Build runtime and test images
        run: |
          docker buildx bake --load --set "*.platform=linux/$ARCH" "$TARGET" "$TARGET-debian"
          docker buildx bake --load --set "*.platform=linux/$ARCH" "$TARGET" \
            --set "$TARGET.target=test" \
            --set "$TARGET.tags=php-eol-patched:$PHP_RELEASE-test"
          for variant in "" -debian -test; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "php-eol-patched:$PHP_RELEASE$variant")
            test "$platform" = "linux/$ARCH"
          done
      - name: Test PHP and FPM
        run: |
          docker pull "$(python3 -B -c "import sys; sys.path.insert(0, 'tests'); import postgresql; print(postgresql.DEFAULT_IMAGE)")"
          python3 tests/run.py \
            --image "php-eol-patched:$PHP_RELEASE" \
            --test-image "php-eol-patched:$PHP_RELEASE-test" \
            --version "$PHP_RELEASE" \
            --output "$RUNNER_TEMP/php-tests.json"
          python3 tests/run.py \
            --variant debian \
            --image "php-eol-patched:$PHP_RELEASE-debian" \
            --version "$PHP_RELEASE" \
            --output "$RUNNER_TEMP/php-debian-tests.json"
      - name: Test PHP 7.1 application example
        if: inputs.target == 'php71'
        run: |
          docker build --pull=false -t php71-app:local examples/php71-app
          docker run --rm php71-app:local php --ri gmp
          docker run --rm php71-app:local php --ri ftp
          docker run --rm php71-app:local php --ri posix
          docker run --rm php71-app:local php-fpm -t
      - name: Test PHP 8.1 sodium example
        if: inputs.target == 'php81'
        run: |
          docker build --pull=false -t php81-sodium:local examples/php81-sodium
          docker run --rm php81-sodium:local php --ri sodium
      # Architecture tags are staging inputs; release tags are assembled below.
      - name: Publish tested architecture images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/php-eol-patched"
          build_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx bake --load --set "*.platform=linux/$ARCH" "$TARGET" \
            --set "$TARGET.target=source" \
            --set "$TARGET.tags=php-eol-patched:$PHP_RELEASE-source"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for variant in -source "" -debian; do
            tag="$PHP_RELEASE$variant-$build_id-$ARCH"
            docker tag "php-eol-patched:$PHP_RELEASE$variant" "$image:$tag"
            docker push "$image:$tag"
          done

  publish:
    name: Publish PHP ${{ inputs.version }} manifests
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PHP_RELEASE: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish both architectures under the release tags
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/php-eol-patched"
          build_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Source manifests must be available before their matching runtimes.
          for variant in -source "" -debian; do
            tag="$PHP_RELEASE$variant-$build_id"
            docker buildx imagetools create --tag "$image:$tag" \
              "$image:$tag-amd64" "$image:$tag-arm64"
            docker buildx imagetools inspect --raw "$image:$tag" | \
              jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          done
          # Rerunning an older commit must not replace the current release tags.
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            for variant in -source "" -debian; do
              tag="$PHP_RELEASE$variant"
              docker buildx imagetools create --tag "$image:$tag" "$image:$tag-$build_id"
            done
          else
            printf '%s\n' 'Published run-specific tags; main has advanced, so release tags were left unchanged.'
          fi
