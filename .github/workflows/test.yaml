name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: php56-debian
            version: 5.6.40
          - target: php70-debian
            version: 7.0.33
          - target: php71-debian
            version: 7.1.33
          - target: php72-debian
            version: 7.2.34
          - target: php73-debian
            version: 7.3.33
          - target: php74-debian
            version: 7.4.33
          - target: php80-debian
            version: 8.0.30
          - target: php81-debian
            version: 8.1.34
    uses: ./.github/workflows/php-release.yaml
    with:
      target: ${{ matrix.target }}
      version: ${{ matrix.version }}
