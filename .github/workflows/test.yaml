name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: php71
            version: 7.1.33
          - target: php72
            version: 7.2.34
          - target: php73
            version: 7.3.33
          - target: php74
            version: 7.4.33
          - target: php80
            version: 8.0.30
          - target: php81
            version: 8.1.34
    env:
      TARGET: ${{ matrix.target }}
      PHP_RELEASE: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check Dockerfile and Compose
        run: |
          docker buildx bake --check "$TARGET"
          docker compose -f compose.example.yaml config --quiet
      - name: Build runtime and test images
        run: |
          docker buildx bake --load "$TARGET"
          docker buildx bake --load "$TARGET" \
            --set "$TARGET.target=test" \
            --set "$TARGET.tags=php-eol-patched:$PHP_RELEASE-test"
      - name: Test PHP and FPM
        run: |
          python3 tests/run.py \
            --image "php-eol-patched:$PHP_RELEASE" \
            --test-image "php-eol-patched:$PHP_RELEASE-test" \
            --version "$PHP_RELEASE" \
            --output "$RUNNER_TEMP/php-tests.json"
