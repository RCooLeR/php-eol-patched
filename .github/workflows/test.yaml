name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs only on main; queue main runs so tags move in commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: php56
            version: 5.6.40
          - target: php70
            version: 7.0.33
          - target: php71
            version: 7.1.33
          - target: php72
            version: 7.2.34
          - target: php73
            version: 7.3.33
          - target: php74
            version: 7.4.33
          - target: php80
            version: 8.0.30
          - target: php81
            version: 8.1.34
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ matrix.target }}
      PHP_RELEASE: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check Dockerfile and Compose
        run: |
          docker buildx bake --check "$TARGET" "$TARGET-debian"
          docker compose -f compose.example.yaml config --quiet
      - name: Build runtime and test images
        run: |
          docker buildx bake --load "$TARGET" "$TARGET-debian"
          docker buildx bake --load "$TARGET" \
            --set "$TARGET.target=test" \
            --set "$TARGET.tags=php-eol-patched:$PHP_RELEASE-test"
      - name: Test PHP and FPM
        run: |
          docker pull "$(python3 -B -c "import sys; sys.path.insert(0, 'tests'); import postgresql; print(postgresql.DEFAULT_IMAGE)")"
          python3 tests/run.py \
            --image "php-eol-patched:$PHP_RELEASE" \
            --test-image "php-eol-patched:$PHP_RELEASE-test" \
            --version "$PHP_RELEASE" \
            --output "$RUNNER_TEMP/php-tests.json"
          python3 tests/run.py \
            --variant debian \
            --image "php-eol-patched:$PHP_RELEASE-debian" \
            --version "$PHP_RELEASE" \
            --output "$RUNNER_TEMP/php-debian-tests.json"
      - name: Test PHP 7.1 application example
        if: matrix.target == 'php71'
        run: |
          docker build --pull=false -t php71-app:local examples/php71-app
          docker run --rm php71-app:local php --ri gmp
          docker run --rm php71-app:local php --ri ftp
          docker run --rm php71-app:local php --ri posix
          docker run --rm php71-app:local php-fpm -t
      - name: Test PHP 8.1 sodium example
        if: matrix.target == 'php81'
        run: |
          docker build --pull=false -t php81-sodium:local examples/php81-sodium
          docker run --rm php81-sodium:local php --ri sodium
      # Push exactly the images tested above, plus the matching source export.
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/php-eol-patched"
          docker buildx bake --load "$TARGET" \
            --set "$TARGET.target=source" \
            --set "$TARGET.tags=php-eol-patched:$PHP_RELEASE-source"
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for variant in "" -debian -source; do
            for tag in "$PHP_RELEASE$variant" "$PHP_RELEASE$variant-${GITHUB_SHA::7}"; do
              docker tag "php-eol-patched:$PHP_RELEASE$variant" "$image:$tag"
              docker push "$image:$tag"
            done
          done
          docker logout ghcr.io
