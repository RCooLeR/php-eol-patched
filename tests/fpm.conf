[global]
daemonize = no
pid = /tmp/php-security-fpm.pid
error_log = /proc/self/fd/2
log_level = notice

[regression]
; The runner starts FPM as uid/gid 1000 with all capabilities dropped.
; These settings are ignored by non-root FPM and retained for config validity.
user = www-data
group = www-data
listen = 127.0.0.1:19000
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
clear_env = no
security.limit_extensions = .php
request_terminate_timeout = 15s
